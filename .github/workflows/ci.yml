#
# CI per docs/ROADMAP.md M0: Windows, Linux and Android with fmt, clippy
# and cargo deny. docs/DEVELOPMENT.md requires that every push builds
# and tests both OSes plus Android, so compile errors surface without
# rebooting.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # prost-build (slateway-proto) shells out to protoc; runners do
      # not ship it.
      - name: Install protoc and libpipewire
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            sudo apt-get update -q
            # protobuf-compiler: prost-build (slateway-proto) shells out to
            # protoc. libpipewire-0.3-dev: pipewire-sys generates its FFI
            # bindings from the installed headers at build time; pipewire
            # itself is a Linux-target-only dependency of slateway-linux.
            sudo apt-get install -y -q protobuf-compiler libpipewire-0.3-dev
          elif command -v choco >/dev/null; then
            choco install protoc -y --no-progress
          else
            echo "no known protoc installer for this runner" >&2
            exit 1
          fi
          protoc --version
      - run: cargo fmt --all --check
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    name: cargo deny
    # One run is enough: cargo-deny resolves the dependency graph for
    # all targets by default, so this also covers Windows-only deps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      # The runner image ships an NDK; cargo-ndk picks it up. Fail on a
      # missing native build here, unlike local builds.
      - name: Build, unit-test and lint
        run: |
          if [ -f android/gradlew ]; then
            cd android
            ./gradlew assembleDebug testDebugUnitTest lintDebug -Pslateway.nativeRequired=true
          else
            echo "::warning::android/ does not exist yet; gradle steps skipped (M0 task pending)"
          fi
