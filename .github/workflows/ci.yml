# SPDX-License-Identifier: GPL-3.0-or-later
#
# CI per docs/ROADMAP.md M0: Windows, Linux and Android with fmt, clippy
# and cargo deny. docs/DEVELOPMENT.md requires that every push builds
# and tests both OSes plus Android, so compile errors surface without
# rebooting.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest migrated to 26.04 in November 2026 and the
        # runner's libavcodec began rejecting the libx264 open with
        # EINVAL (local n9.0.2 opens fine) - pinned until the FFmpeg
        # 9.1+ option handling is investigated (see DEVELOPMENT.md).
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung apt mirror once stretched this job to 24 minutes; cap it so
    # a dead mirror fails fast instead of occupying a runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # ffmpeg-sys-next (slateway-ffmpeg encoder, ADR-014) links the
      # system FFmpeg. Pinned gyan.dev shared build: it ships MSVC
      # import libs (.lib), headers and the runtime DLLs; FFMPEG_DIR
      # feeds the build script, the bin dir the test binaries.
      - name: Install FFmpeg dev libraries (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = "$env:GITHUB_WORKSPACE\ffmpeg"
          $zip = "$env:RUNNER_TEMP\ffmpeg-shared.zip"
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-full_build-shared.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest
          $ffmpeg = "$dest\ffmpeg-9.0.2-full_build-shared"
          "FFMPEG_DIR=$ffmpeg" >> $env:GITHUB_ENV
          "$ffmpeg\bin" >> $env:GITHUB_PATH
      # The apt set is tens of MB and is downloaded on every run. On
      # 2026-11-19 the runner's mirror (us-east-2.ec2.archive.ubuntu.com)
      # dropped to 88 kB/s: this step took 23 minutes while the cached
      # cargo work took 20 seconds. Keep the .debs between runs so a
      # slow mirror only costs the first run after a package change.
      - name: Cache apt archives
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-v1-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-v1-

      # prost-build (slateway-proto) shells out to protoc; runners do
      # not ship it.
      - name: Install protoc and libpipewire
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            sudo apt-get update -q
            # protobuf-compiler: prost-build (slateway-proto) shells out to
            # protoc. libpipewire-0.3-dev: pipewire-sys generates its FFI
            # bindings from the installed headers at build time; pipewire
            # itself is a Linux-target-only dependency of slateway-linux.
            # The libav*-dev set: slateway-ffmpeg enables only ffmpeg-next's
            # codec+format features, so libavcodec, libavformat and libavutil
            # are the only headers pkg-config has to find (the version is
            # auto-detected, 3.0 through 9.x supported). --no-install-
            # recommends skips the VA-API/VDPAU drivers and the 27 MB
            # pocketsphinx model, which nothing here uses.
            sudo mkdir -p "$RUNNER_TEMP/apt-archives/partial"
            sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/apt-archives" \
              install -y -q --no-install-recommends \
              protobuf-compiler libpipewire-0.3-dev \
              libavcodec-dev libavformat-dev libavutil-dev
            # actions/cache runs as the runner user; apt's root-owned
            # partial/ and lock would fail the post-job save.
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/apt-archives"
          elif command -v choco >/dev/null; then
            choco install protoc -y --no-progress
          else
            echo "no known protoc installer for this runner" >&2
            exit 1
          fi
          protoc --version
      - run: cargo fmt --all --check
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    name: cargo deny
    # One run is enough: cargo-deny resolves the dependency graph for
    # all targets by default, so this also covers Windows-only deps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      # The runner image ships an NDK; cargo-ndk picks it up. Fail on a
      # missing native build here, unlike local builds.
      - name: Build, unit-test and lint
        run: |
          if [ -f android/gradlew ]; then
            cd android
            ./gradlew assembleDebug testDebugUnitTest lintDebug -Pslateway.nativeRequired=true
          else
            echo "::warning::android/ does not exist yet; gradle steps skipped (M0 task pending)"
          fi
