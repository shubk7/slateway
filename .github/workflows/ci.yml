#
# CI per docs/ROADMAP.md M0: Windows, Linux and Android with fmt, clippy
# and cargo deny. docs/DEVELOPMENT.md requires that every push builds
# and tests both OSes plus Android, so compile errors surface without
# rebooting.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    name: cargo deny
    # One run is enough: cargo-deny resolves the dependency graph for
    # all targets by default, so this also covers Windows-only deps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # The android/ module arrives with its own M0 task; until then
      # this job stays green and warns. Remove the guard once it lands.
      - name: Build, unit-test and lint (skipped until android/ exists)
        run: |
          if [ -f android/gradlew ]; then
            cd android
            ./gradlew assembleDebug testDebugUnitTest lintDebug
          else
            echo "::warning::android/ does not exist yet; gradle steps skipped (M0 task pending)"
          fi
