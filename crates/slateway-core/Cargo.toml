[package]
name = "slateway-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Slateway sessions, channels, pairing, clock sync and stats; platform-agnostic."

[lints]
workspace = true

[dependencies]
prost = "0.14.4"
slateway-proto = { version = "0.1.0", path = "../slateway-proto" }
snow = "0.10.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "rt", "macros", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
