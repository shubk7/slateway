//
// Slateway control-channel schema (docs/PROTOCOL.md, "Control
// schemas"). Normative: host and tablet both generate code from this
// one file. Frame type numbers live in docs/PROTOCOL.md; never reuse
// one, only append.

syntax = "proto3";

package slateway.control.v0;

// One top-level Java/Kotlin class per message (the default wraps all
// messages in an outer class named after the file). Codegen only; the
// wire bytes are unaffected.
option java_multiple_files = true;

// Sent by the tablet once the encrypted channel is up; answered by
// HelloAck (frame types 1 and 2).
message Hello {
  // Protocol version, draft v0 today. Major mismatch is refused.
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  // Tablet app version, e.g. "0.1.0".
  string app_version = 3;
  // Build.MODEL of the tablet.
  string device_model = 4;
  // Build.VERSION.SDK_INT.
  uint32 android_api = 5;
  // Video decoders the tablet supports.
  repeated VideoCodec codecs = 6;
  // Decoder capability limits.
  DecodeLimits decode_limits = 7;
  // The tablet's main display.
  Screen screen = 8;
  // Capability bitmask; every bit is reserved in M0.
  uint64 capabilities = 9;
}

// Host answer to Hello.
message HelloAck {
  // Accepted protocol version; equals Hello's on success.
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  // Host daemon version.
  string app_version = 3;
  // Capability bitmask; every bit is reserved in M0.
  uint64 capabilities = 4;
}

// Orderly shutdown in either direction (frame type 3). After Close,
// both sides stop sending and tear the session down.
message Close {
  CloseReason reason = 1;
}

// Clock sync (frame types 4 and 5, docs/PROTOCOL.md "Clocks"): the
// host sends Ping once per second; the tablet answers Pong. The host
// stamps t3 itself on arrival, so only t0 to t2 cross the wire. All
// timestamps are monotonic microseconds in the sender's own timebase.
message Ping {
  // Host send time.
  uint64 t0 = 1;
}

message Pong {
  // Echoed host send time.
  uint64 t0 = 1;
  // Tablet receive time.
  uint64 t1 = 2;
  // Tablet send time.
  uint64 t2 = 3;
}

// Tablet health report for the latency overlay (docs/PROTOCOL.md,
// "Control messages"): decode time and queue depth. Extended
// additively as stages land; zero in M0.
message Stats {
  // Decode duration of the last frame.
  uint64 decode_us = 1;
  // Frames queued for decode.
  uint32 queue_depth = 2;
}

message DecodeLimits {
  uint32 max_width_px = 1;
  uint32 max_height_px = 2;
  uint32 max_fps = 3;
}

message Screen {
  uint32 width_px = 1;
  uint32 height_px = 2;
  // Refresh rate in millihertz: 60000 is 60 Hz.
  uint32 refresh_millihz = 3;
}

enum VideoCodec {
  VIDEO_CODEC_UNKNOWN = 0;
  H264_BASELINE = 1;
  H264_MAIN = 2;
  H264_HIGH = 3;
}

enum CloseReason {
  CLOSE_REASON_UNSPECIFIED = 0;
  // The Hello protocol major did not match; the session is refused.
  MAJOR_MISMATCH = 1;
  NORMAL_SHUTDOWN = 2;
  ERROR = 3;
}
