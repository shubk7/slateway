[package]
name = "slateway-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Slateway Linux backends."

# Platform-specific code lives only here (AGENTS.md rule 2); everything
# not gated on `cfg(linux)` must build everywhere.
[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# ScreenCast portal client (approved as part of the M1 capture task; MIT).
ashpd = { version = "0.14.0", features = ["screencast"] }
# PipeWire stream consumer for the portal's frames (MIT); re-exports
# libspa, which we use for buffer and pod types.
pipewire = "0.10.1"
slateway-platform = { version = "0.1.0", path = "../slateway-platform" }
# One-shot current-thread runtime for the portal's async calls in start().
tokio = { version = "1.54.1", features = ["rt"] }
