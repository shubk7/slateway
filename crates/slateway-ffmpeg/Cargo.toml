[package]
name = "slateway-ffmpeg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Shared FFmpeg (libavcodec) encoder plumbing for the Slateway host."

[lints]
workspace = true

[dependencies]
# Safe libavcodec wrapper (WTFPL, GPLv3-compatible; user-approved as
# part of the M1 encoder task per ADR-014). Auto-detects the system
# FFmpeg version. Only the `codec` feature is enabled: this crate uses
# libavcodec + libavutil, and the default features would also demand
# libavformat/libavfilter/libavdevice/libswscale/libswresample headers
# (and pull ~100 MB of extra dev packages into CI).
ffmpeg-next = { version = "9.1.0", default-features = false, features = ["codec", "format"] }
slateway-platform = { version = "0.1.0", path = "../slateway-platform" }
