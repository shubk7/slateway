[package]
name = "slateway-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Slateway platform traits and shared types only."

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
# The injector trait takes the wire event type (docs/PROTOCOL.md
# "Input event") so the daemon passes decoded events through without
# a duplicate struct. Internal crate, no new external dependency.
slateway-proto = { path = "../slateway-proto", version = "0.1.0" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "process", "io-util", "rt", "macros", "time"] }
