# SPDX-License-Identifier: GPL-3.0-or-later

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/shubk7/slateway"
publish = false

[workspace.lints.rust]
# Any future unsafe block needs an explicit opt-in plus a `// SAFETY:`
# comment; it is also on the review gate in AGENTS.md.
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
