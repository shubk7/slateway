[package]
name = "slateway-proto-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Standalone workspace: the fuzz crate is not a member of the root
# workspace; it is built with cargo fuzz and its own lockfile.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
prost = "0.14"

[dependencies.slateway-proto]
path = "../crates/slateway-proto", version = "0.1.0"

[[bin]]
name = "frame_header"
path = "fuzz_targets/frame_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "input_batch"
path = "fuzz_targets/input_batch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control_message"
path = "fuzz_targets/control_message.rs"
test = false
doc = false
bench = false
